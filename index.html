<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1627"><title>Court scoreboard v13</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#fff;background:#071426}*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#071426}main{width:100%;min-height:100dvh;display:flex;flex-direction:column;padding:clamp(14px,2vw,30px);gap:clamp(12px,2vh,25px)}
header{display:flex;align-items:center;justify-content:space-between;gap:15px;font-size:clamp(19px,2.4vw,36px);font-weight:750}.rule{height:3px;background:linear-gradient(to right,#ee0039 40%,#aebbd0 40%)}
.mode{display:none}.sub{display:none}.content{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.5vh,16px)}
.player{display:grid;grid-template-columns:minmax(0,44%) minmax(100px,14%) minmax(0,33%) minmax(76px,9%);background:#f5f7fa;color:#081528;border-radius:15px;overflow:hidden;min-height:clamp(155px,29vh,250px);border-left:clamp(8px,1.2vw,18px) solid #aeb9ca}
.player.serving{border-left-color:#ef0039}.identity{min-width:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(12px,2.3vw,36px)}.flag-above{height:29px;display:flex;align-items:center;gap:8px;margin-bottom:5px}.flag-icon{width:36px;height:24px;object-fit:cover;border:1px solid #d1d7df;border-radius:2px;display:block}.flag-code{font-size:13px;font-weight:800;color:#465a76;letter-spacing:.07em;display:none}.flag-above.fallback .flag-code{display:inline}.player-label{color:#465a76;font-size:clamp(14px,1.5vw,22px);font-weight:800;margin-bottom:clamp(5px,1.3vh,14px)}.name{font-size:clamp(24px,3.7vw,64px);font-weight:900;line-height:1.06;overflow-wrap:anywhere}.country{font-size:clamp(11px,1vw,16px);color:#718096;margin-top:8px}.serve{color:#ed003a;font-size:.6em;margin-left:9px;vertical-align:middle}
.point-block{border-left:1px solid #dbe1e9;border-right:1px solid #dbe1e9;display:flex;align-items:center;justify-content:center;font-size:clamp(75px,11vw,190px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}.serving .point-block{background:#ed0039;color:#fff}
.games-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:clamp(5px,1vw,18px) clamp(3px,.7vw,12px)}.game-cell{text-align:center;border-right:1px solid #d8e0ea;min-width:0}.game-cell:last-child{border-right:0}.game-label{font-weight:800;color:#536783;font-size:clamp(12px,1.35vw,21px);margin-bottom:12px}.game-number{font-weight:900;font-size:clamp(24px,3.2vw,55px);font-variant-numeric:tabular-nums}.game-number.won{background:#ffdbe2;border-radius:7px;display:inline-block;padding:4px 5px}
.won-games{border-left:1px solid #dbe1e9;display:flex;flex-direction:column;align-items:center;justify-content:center}.won-label{font-weight:800;color:#526681;font-size:clamp(11px,1.2vw,19px)}.won-number{font-size:clamp(60px,8vw,140px);font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums}
.next .point-block,.next .games-grid,.next .won-games{opacity:.35}.center{text-align:center;color:#ef5476;font-weight:800;font-size:26px}.message{text-align:center;font-size:clamp(35px,7vw,90px);font-weight:900}.smallmsg{text-align:center;color:#b8c7d9;font-size:clamp(18px,2.6vw,34px)}
footer{text-align:center;color:#b7c3d5;font-size:clamp(12px,1vw,17px);display:flex;justify-content:center;align-items:center;gap:5px;padding:5px}.rankedin-logo{height:1.05em;width:auto;max-width:110px;object-fit:contain;vertical-align:middle}.rankedin-text{font-weight:700}.status{position:fixed;bottom:5px;right:8px;font-size:11px;color:#ffb3b3}.debug{position:fixed;top:0;left:0;right:0;max-height:40vh;overflow:auto;background:#101010;color:#afa;font:12px monospace;padding:12px;z-index:10;white-space:pre-wrap;display:none}body.debug-on .debug{display:block}
@media(max-width:850px){.player{grid-template-columns:minmax(0,39%) minmax(72px,17%) minmax(0,33%) minmax(55px,11%)}.identity{padding:12px}.name{font-size:clamp(19px,3.6vw,34px)}.point-block{font-size:clamp(55px,10vw,105px)}.game-label{margin-bottom:6px}.game-number{font-size:clamp(17px,3vw,30px)}.won-number{font-size:clamp(42px,7vw,76px)}}
@media(max-width:520px){main{padding:8px}.player{min-height:145px;grid-template-columns:minmax(0,40%) minmax(65px,18%) minmax(0,31%) minmax(45px,11%)}.name{font-size:clamp(17px,4.2vw,25px)}.game-label{font-size:9px}.game-number{font-size:17px}.won-label{font-size:9px}.won-number{font-size:39px}}
</style></head><body><main><header><span id="tournament"></span><span id="court">COURT</span></header><div class="rule"></div><div id="mode" class="mode"></div><div id="sub" class="sub"></div><section id="content" class="content"><div class="message">Connecting…</div></section><footer>Powered by <img class="rankedin-logo" src="rankedin-logo.png" alt="Rankedin" onerror="this.style.display='none';document.getElementById('rankedin-text').style.display='inline'"><span id="rankedin-text" class="rankedin-text" style="display:none">Rankedin</span></footer></main><div id="status" class="status"></div><pre id="debug" class="debug"></pre>
<script>
'use strict';
const q=new URLSearchParams(location.search),COURT=q.get('court')||'192806',REFRESH=Math.max(2,Number(q.get('refresh'))||5)*1000,FINAL_MS=60000;
const $=id=>document.getElementById(id);
$('tournament').textContent=q.get('title')||'SQUASH TOURNAMENT';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const asArray=x=>Array.isArray(x)?x:x?[x]:[];
function name(x){return asArray(x).map(p=>typeof p==='string'?p:[p?.firstName,p?.middleName,p?.lastName].filter(Boolean).join(' ')||p?.name||p?.fullName||'').filter(Boolean).join(' / ')||'TBA'}
function country(x){return String(asArray(x)[0]?.countryCode||'').toUpperCase()}
function flag(x){
 const c=String(asArray(x)[0]?.countryCode||'').trim().toUpperCase();
 if(!/^[A-Z]{2}$/.test(c))return '';
 // SVG is embedded directly in the page: no external server, font or emoji required.
 const rect=(color,y,h)=>`<rect y="${y}" width="48" height="${h}" fill="${color}"/>`;
 const horizontal=(colors)=>colors.map((v,i)=>rect(v,i*32/colors.length,32/colors.length)).join('');
 const cross=(base,border,inside)=>`<rect width="48" height="32" fill="${base}"/><rect x="14" width="9" height="32" fill="${border}"/><rect y="12" width="48" height="9" fill="${border}"/><rect x="17" width="3" height="32" fill="${inside}"/><rect y="15" width="48" height="3" fill="${inside}"/>`;
 const designs={
  LV:'<rect width="48" height="32" fill="#9e1b34"/><rect y="12.8" width="48" height="6.4" fill="#fff"/>',
  LT:horizontal(['#fdb913','#006a44','#c1272d']),
  EE:horizontal(['#4891d9','#171717','#fff']),
  DE:horizontal(['#000','#dd0000','#ffce00']),
  NL:horizontal(['#ae1c28','#fff','#21468b']),
  FR:'<rect width="16" height="32" fill="#002395"/><rect x="16" width="16" height="32" fill="#fff"/><rect x="32" width="16" height="32" fill="#ed2939"/>',
  IT:'<rect width="16" height="32" fill="#009246"/><rect x="16" width="16" height="32" fill="#fff"/><rect x="32" width="16" height="32" fill="#ce2b37"/>',
  PL:horizontal(['#fff','#dc143c']),
  UA:horizontal(['#0057b7','#ffd700']),
  AT:horizontal(['#ed2939','#fff','#ed2939']),
  HU:horizontal(['#ce2939','#fff','#477050']),
  RU:horizontal(['#fff','#0039a6','#d52b1e']),
  FI:cross('#fff','#003580','#003580'),
  SE:cross('#006aa7','#fecc00','#fecc00'),
  NO:cross('#ba0c2f','#fff','#00205b'),
  DK:cross('#c8102e','#fff','#fff'),
  CH:'<rect width="48" height="32" fill="#da291c"/><path d="M20 5h8v7h8v8h-8v7h-8v-7h-8v-8h8z" fill="#fff"/>',
  JP:'<rect width="48" height="32" fill="#fff"/><circle cx="24" cy="16" r="9" fill="#bc002d"/>',
  BE:'<rect width="16" height="32"/><rect x="16" width="16" height="32" fill="#fae042"/><rect x="32" width="16" height="32" fill="#ed2939"/>',
  IE:'<rect width="16" height="32" fill="#169b62"/><rect x="16" width="16" height="32" fill="#fff"/><rect x="32" width="16" height="32" fill="#ff883e"/>'
 };
 const svg=designs[c];
 const svgDocument=svg?`<svg xmlns="http://www.w3.org/2000/svg" width="48" height="32" viewBox="0 0 48 32">${svg}</svg>`:null;
 const url=svgDocument?'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgDocument):`https://flagcdn.com/w80/${c.toLowerCase()}.png`;
 const visual=`<img class="flag-icon" src="${url}" alt="" loading="eager" onerror="this.style.display='none';this.parentElement.classList.add('fallback')">`;
 return `<div class="flag-above">${visual}<span class="flag-code">${esc(c)}</span></div>`;
}

function row(x,points,sets=[],gamesWon='–',serve=false,index=1,opponentSets=[],isNext=false){
 const values=Array.isArray(sets)?sets:[];const theirs=Array.isArray(opponentSets)?opponentSets:[];
 return `<div class="player ${serve?'serving':''} ${isNext?'next':''}"><div class="identity">${flag(x)}<div class="name">${esc(name(x))}${serve?'<span class="serve">▶</span>':''}</div></div><div class="point-block">${esc(points)}</div><div class="games-grid">${Array.from({length:5},(_,i)=>{const v=values[i],o=theirs[i],won=v!=null&&o!=null&&Number(v)>Number(o)&&((Number(v)>=11&&Number(v)-Number(o)>=2)||(Number(v)>11&&Number(v)-Number(o)>=2));return `<div class="game-cell"><div class="game-label">G${i+1}</div><div class="game-number ${won?'won':''}">${esc(v??'–')}</div></div>`}).join('')}</div><div class="won-games"><div class="won-label">GAMES</div><div class="won-number">${esc(gamesWon)}</div></div></div>`;
}
function heading(m,s=''){$('mode').textContent=m;$('sub').textContent=s;document.getElementById('court').textContent=(latest?.details?.courtName||'CT '+COURT)+(s?'   |   '+s:'')}
let latest=null,lastLive=null,finalId=null,finalUntil=0,lastFetch=0,loading=false;
const key='court-final-v13-'+COURT;
try{const v=JSON.parse(sessionStorage.getItem(key)||'null');if(v?.until>Date.now()){finalId=v.id;finalUntil=v.until}}catch{}
function draw(d){$('court').textContent=d.details?.courtName||'CT '+COURT;const live=d.liveMatch,prev=d.previousMatch,next=d.nextMatch,now=Date.now();
 if(live){const base=live.base||live,st=live.state||live,sc=st.score||{},games=Array.isArray(sc.detailedResult)?sc.detailedResult:[],current=games.at(-1)||{};
 const first=base.firstParticipant||live.firstParticipant,second=base.secondParticipant||live.secondParticipant;
 const g1=sc.firstParticipantScore??0,g2=sc.secondParticipantScore??0;
 const serve=st.serve?.isFirstParticipantServing;
 heading('SCOREBOARD',`Game ${Math.min(5,Math.max(1,Number(sc.index||games.length-1)+1))} (Best of 5)`);
 $('content').innerHTML=row(first,current.firstParticipantScore??'–',games.map(v=>v.firstParticipantScore),g1,serve===true,1,games.map(v=>v.secondParticipantScore))+row(second,current.secondParticipantScore??'–',games.map(v=>v.secondParticipantScore),g2,serve===false,2,games.map(v=>v.firstParticipantScore));
 lastLive=String(base.matchId??st.matchId??'');finalUntil=0;finalId=null;sessionStorage.removeItem(key);return;
 }
 if(lastLive&&prev&&String(prev.matchId)===lastLive&&String(finalId)!==lastLive){finalId=String(prev.matchId);finalUntil=now+FINAL_MS;sessionStorage.setItem(key,JSON.stringify({id:finalId,until:finalUntil}))}
 lastLive=null;
 if(prev&&String(prev.matchId)===String(finalId)&&now<finalUntil){const sc=prev.score||{},games=sc.detailedResult||[];heading('FINAL RESULT',`FINAL RESULT · ${prev.className||''} · ${sc.firstParticipantScore??'–'} : ${sc.secondParticipantScore??'–'}`);$('content').innerHTML=row(prev.firstParticipant,'–',games.map(v=>v.firstParticipantScore),sc.firstParticipantScore??'–',false,1,games.map(v=>v.secondParticipantScore))+row(prev.secondParticipant,'–',games.map(v=>v.secondParticipantScore),sc.secondParticipantScore??'–',false,2,games.map(v=>v.firstParticipantScore));return}
 if(finalUntil&&now>=finalUntil){finalUntil=0;finalId=null;sessionStorage.removeItem(key)}
 if(next){heading('NEXT MATCH',['NEXT MATCH',next.className,typeof next.startTime==='string'?next.startTime.slice(11,16):''].filter(Boolean).join(' · '));$('content').innerHTML=row(next.firstParticipant,'–',[],'–',false,1,[],true)+row(next.secondParticipant,'–',[],'–',false,2,[],true);return}
 heading('','');$('content').innerHTML='<div class="message">COURT AVAILABLE</div><div class="smallmsg">Waiting for the next match</div>';
}
function debug(d,error){if(q.get('debug')!=='1')return;document.body.classList.add('debug-on');$('debug').textContent=JSON.stringify({version:'v13',time:new Date().toISOString(),lastFetch:lastFetch?new Date(lastFetch).toISOString():null,error:error||null,liveMatch:!!d?.liveMatch,liveNames:d?.liveMatch?{first:name((d.liveMatch.base||d.liveMatch).firstParticipant),second:name((d.liveMatch.base||d.liveMatch).secondParticipant)}:null,nextMatch:!!d?.nextMatch,nextNames:d?.nextMatch?{first:name(d.nextMatch.firstParticipant),second:name(d.nextMatch.secondParticipant)}:null,raw:d},null,2)}
const demo={details:{courtName:'CT1'},liveMatch:{base:{matchId:7016504,className:'M2',firstParticipant:[{firstName:'Ilvars',lastName:'Auseklis',countryCode:'lv'}],secondParticipant:[{firstName:'Kārlis',lastName:'Martinsons',countryCode:'lv'}]},state:{serve:{isFirstParticipantServing:false},score:{firstParticipantScore:1,secondParticipantScore:1,detailedResult:[{firstParticipantScore:11,secondParticipantScore:8},{firstParticipantScore:9,secondParticipantScore:11},{firstParticipantScore:4,secondParticipantScore:3}]}}},previousMatch:null,nextMatch:{className:'M2',startTime:'2026-11-01T14:30:00',firstParticipant:[{firstName:'Pēteris',lastName:'Grīnbergs',countryCode:'lv'}],secondParticipant:[{firstName:'Aivars',lastName:'Dziļums',countryCode:'lv'}]}};
async function poll(){if(loading)return;loading=true;try{let data;if(q.get('demo')==='live'){data=demo}else if(q.get('demo')==='next'){data={...demo,liveMatch:null}}else{const url=`https://live.rankedin.com/api/v1/court/${encodeURIComponent(COURT)}/scoreboard?t=${Date.now()}`;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);let res;try{res=await fetch(url,{cache:'no-store',signal:controller.signal})}finally{clearTimeout(timeout)}if(!res.ok)throw Error('HTTP '+res.status);data=await res.json()}
 if(!data||typeof data!=='object'||!('liveMatch'in data)||!('nextMatch'in data))throw Error('Unexpected API structure');latest=data;lastFetch=Date.now();draw(data);debug(data,null);$('status').textContent=q.get('debug')==='1'?'Updated '+new Date(lastFetch).toLocaleTimeString()+' · Match '+(data.liveMatch?.base?.matchId||'none')+' · v13':'';
 }catch(e){$('status').textContent='API error: '+e.message;debug(latest,e.message);if(!latest){heading('CONNECTION ERROR');$('content').innerHTML='<div class="smallmsg">Cannot load Rankedin data</div>'}}finally{loading=false}}
poll();setInterval(poll,REFRESH);setInterval(()=>{if(latest)draw(latest);if(lastFetch&&Date.now()-lastFetch>REFRESH*3)$('status').textContent='Data not updated — check connection'},1000);
</script></body></html>
